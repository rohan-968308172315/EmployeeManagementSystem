{% include "navbar.html" %}

<div class="page-header">
    <h3 class="page-title">
        Edit Department
    </h3>

</div>


<div class="container">
    <div class="row">
        <div class="col-md-12">
            <form class="forms-sample" action="{% url 'update_department' editdep.id%}" method="post">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-4">
                        <input type="hidden" name="id" value="{{editdep.id}}" id="">
                        <div class="form-group">
                            <label for="dpnmae">Department Name</label>
                            <input type="text" class="form-control" id="dpnmae" name="department_name"
                                placeholder="Department Name" value="{{editdep.department_name}}" required>
                        </div>
                    </div>

                    <div class="col-md-8">

                        <div class="form-group">
                            <label for="dppass">Description</label>
                            <textarea class="form-control"  name="description" placeholder="Description...">{{editdep.description}}</textarea>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <label for="dpcode">Department Code</label>
                            <input type="text" class="form-control" id="dpcode" name="department_code"
                                placeholder="Department Code" required value="{{editdep.department_code}}">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <label for="dpcode">Status</label>
                            <select name="status"  class="form-control p-3" required >
                                <option value="">Choose Option</option>
                                <option value="Active" {% if editdep.status == "Active" %}selected {% endif %}>Active</option>
                                <option value="Inactive" {% if editdep.status == "Inactive" %}selected {% endif %}>Inactive</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <br>
                        <button type="submit" class="btn btn-gradient-primary me-2 mt-1">Update</button>
                    </div>
                </div>


            </form>
        </div>
    </div>
</div>
{% include "footer.html" %}
