{% include "navbar.html" %}

<div class="card">
    <div class="card-body">
        <div class="container">
            <div class="row">
                <div class="d-flex justify-content-sm-between mb-5">
                    <h3 class="page-title">Company Details</h3>
                </div>

                <div class="col-md-12">
                    <form class="forms-sample" action="{% url 'update_company_details' comp.id %}" method="post"
                        enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>Company Name</label>
                                    <input type="text" class="form-control" name="company_name"
                                        placeholder="Enter Company Name" value="{{comp.company_name}}" required>
                                </div>
                                <input type="hidden" name="id" value="{{comp.id}}" id="">
                            </div>



                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>Email</label>
                                    <input type="email" class="form-control" name="email" value="{{comp.email}}"
                                        placeholder="Enter Company Email">
                                </div>
                            </div>

                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>Phone</label>
                                    <input type="text" class="form-control" name="phone" maxlength="20"
                                        placeholder="Enter Phone Number" value="{{comp.phone}}">
                                </div>
                            </div>

                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>Website</label>
                                    <input type="url" class="form-control" name="website"
                                        placeholder="https://example.com" value="{{comp.website}}">
                                </div>
                            </div>

                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>Establish Date</label>
                                    <input type="date" class="form-control" name="established_on"
                                        value="{{ comp.established_on|date:'Y-m-d' }}">
                                </div>
                            </div>

                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>GST Number</label>
                                    <input type="text" class="form-control" name="gst_number"
                                        placeholder="Enter GST Number" value="{{comp.gst_number}}">
                                </div>
                            </div>

                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>Registration Number</label>
                                    <input type="text" class="form-control" name="registration_number"
                                        placeholder="Enter Registration Number" value="{{comp.registration_number}}">
                                </div>
                            </div>

                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>City</label>
                                    <input type="text" value="{{comp.city}}" class="form-control" name="city"
                                        placeholder="Enter City">
                                </div>
                            </div>

                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>State</label>
                                    <input type="text" class="form-control" name="state" placeholder="Enter State"
                                        value="{{comp.state}}">
                                </div>
                            </div>

                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>Pincode</label>
                                    <input type="text" class="form-control" name="pincode" maxlength="10"
                                        placeholder="Enter Pincode" value="{{comp.pincode}}">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>Logo</label>
                                    <input type="file" class="form-control" name="logo" accept="image/*">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    {% if comp.logo %}
                                    <img src="{{ comp.logo.url }}" width="100px" height="100px" style="border-radius: 50%;" alt="">
                                    {% endif %}
                                </div>
                            </div>

                            <div class="col-md-12">
                                <div class="form-group">
                                    <label>Address</label>
                                    <textarea class="form-control" name="address" rows="3"
                                        placeholder="Enter Company Address">{{comp.address}}</textarea>
                                </div>
                            </div>

                            <div class="col-md-12">
                                <div class="form-group">
                                    <label>Description</label>
                                    <textarea class="form-control" name="description" rows="4"
                                        placeholder="Enter Company Description">{{comp.description}}</textarea>
                                </div>
                            </div>

                            <div class="col-md-12">
                                <button type="submit" class="btn btn-gradient-primary me-2 mt-1">Save</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% include "footer.html" %}
